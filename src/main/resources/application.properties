quarkus.http.port=8080
quarkus.http.host=127.0.0.1
%prod.quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${AUTH_CORS_ORIGINS:}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.jackson.fail-on-unknown-properties=false
auth.database.url=${AUTH_DB_URL:jdbc:sqlite:./data/workshop.db}
auth.student.password=${AUTH_STUDENT_PASSWORD:}
auth.trainer.password=${AUTH_TRAINER_PASSWORD:}
auth.jwt.secret=${AUTH_JWT_SECRET:}
